<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tạo mã QR</title>
<style>
:root{--bg:#e8eef2;--panel:#fff;--ink:#14232b;--muted:#5b6b75;--line:#c8d3da;--field:#f6f9fb;--accent:#0e6b66;--danger:#b3261e;--soft:#dde6eb}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{touch-action:manipulation;-webkit-text-size-adjust:100%}
body{margin:0;min-height:100dvh;padding:max(16px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:440px;margin:0 auto;display:grid;gap:12px}
.card{background:var(--panel);border-radius:16px;padding:14px;display:grid;gap:12px}
label{display:block;font-weight:600;font-size:14px;margin-bottom:4px}
textarea,input[type=url],select{width:100%;font:inherit;color:var(--ink);background:var(--field);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{min-height:84px;resize:vertical}
input[type=color]{width:100%;height:42px;padding:3px;background:var(--field);border:1.5px solid var(--line);border-radius:10px}
[hidden]{display:none!important}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--soft);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;color:var(--muted);font:inherit;font-weight:600;font-size:14px;padding:8px 4px;border-radius:8px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(20,35,43,.18)}
.stage{display:grid;place-items:center;aspect-ratio:1;background:var(--field);border:1.5px dashed var(--line);border-radius:14px;color:var(--muted);font-size:14px;overflow:hidden}
canvas{width:100%;height:100%;object-fit:contain;display:block}
.error{margin:0;min-height:0;color:var(--danger);font-size:14px;text-align:center}
.error:empty{display:none}
.btn{border:0;font:inherit;font-weight:600;font-size:15px;padding:12px 8px;border-radius:12px;cursor:pointer;background:var(--soft);color:var(--ink)}
.btn.primary{background:var(--accent);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:active:not(:disabled){transform:translateY(1px)}
.actions{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:8px}
details summary{font-weight:600;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"+";color:var(--muted)}
details[open] summary::after{content:"–"}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.full{grid-column:1/-1}
.logo-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.logo-tools{display:grid;gap:10px;margin-top:10px}
.logo-size{display:flex;align-items:center;gap:10px}
.logo-size img{width:40px;height:40px;object-fit:contain;background:var(--field);border:1.5px solid var(--line);border-radius:8px}
.logo-size input{flex:1;min-width:0;accent-color:var(--accent)}
.logo-size span{min-width:36px;text-align:right;font-size:13px;color:var(--muted)}
:is(button,input,select,textarea,summary):focus-visible{outline:3px solid #6bb7b1;outline-offset:2px}
</style>
</head>
<body>
<main>
  <section class="card">
    <div class="seg" id="seg-mode">
      <button type="button" data-v="text" aria-pressed="true">Văn bản</button>
      <button type="button" data-v="web" aria-pressed="false">Website</button>
    </div>
    <textarea id="in-text" placeholder="Nhập hoặc dán văn bản" aria-label="Nội dung"></textarea>
    <input type="url" id="in-web" inputmode="url" autocapitalize="off" autocomplete="off" spellcheck="false" placeholder="vi-du.com" aria-label="Địa chỉ website" hidden>
  </section>

  <section class="card">
    <div class="stage"><span id="empty">QR hiện ở đây</span><canvas id="canvas" hidden></canvas></div>
    <p class="error" id="error" role="alert"></p>
    <div class="actions">
      <button class="btn primary" id="btn-png" type="button" disabled>Tải PNG</button>
      <button class="btn" id="btn-svg" type="button" disabled>SVG</button>
      <button class="btn" id="btn-copy" type="button" disabled>Sao chép</button>
    </div>
  </section>

  <details class="card">
    <summary>Tuỳ chọn</summary>
    <div class="opts">
      <div><label for="opt-size">Kích thước</label>
        <select id="opt-size">
          <option value="256">256 px</option>
          <option value="512" selected>512 px</option>
          <option value="1024">1024 px</option>
          <option value="2048">2048 px</option>
        </select>
      </div>
      <div><label for="opt-fg">Màu mã</label><input type="color" id="opt-fg" value="#14232b"></div>
      <div><label for="opt-bg">Màu nền</label><input type="color" id="opt-bg" value="#ffffff"></div>
      <div class="full">
        <label>Ảnh giữa</label>
        <input type="file" id="logo-file" accept="image/*" hidden>
        <div class="logo-row">
          <button class="btn" id="btn-logo" type="button">Chọn ảnh</button>
          <button class="btn" id="btn-logo-clear" type="button" disabled>Xoá ảnh</button>
        </div>
        <div class="logo-tools" id="logo-tools" hidden>
          <div class="logo-size">
            <img id="logo-thumb" alt="">
            <input type="range" id="logo-size" min="10" max="25" value="16" aria-label="Kích thước ảnh giữa">
            <span id="logo-pct">16%</span>
          </div>
          <div class="seg" id="seg-shape">
            <button type="button" data-v="square" aria-pressed="false">Vuông</button>
            <button type="button" data-v="rounded" aria-pressed="true">Bo góc</button>
            <button type="button" data-v="circle" aria-pressed="false">Tròn</button>
          </div>
        </div>
      </div>
    </div>
  </details>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const canvas = $('canvas');
  const ctx = canvas.getContext('2d');
  const buttons = [$('btn-png'), $('btn-svg'), $('btn-copy')];
  const MARGIN = 4;
  const state = { mode: 'text', shape: 'rounded', logo: null, qr: null };
  let timer = 0;
  let copyTimer = 0;

  const showError = text => { $('error').textContent = text || ''; };

  if (!window.qrcode) {
    showError('Không tải được thư viện QR. Kiểm tra mạng rồi mở lại.');
    return;
  }
  qrcode.stringToBytes = qrcode.stringToBytesFuncs['UTF-8'];

  const readContent = () => {
    if (state.mode === 'text') return { value: $('in-text').value };
    let value = $('in-web').value.trim();
    if (!value) return { value: '' };
    if (!/^[a-z][a-z0-9+.-]*:\/\//i.test(value)) value = 'https://' + value;
    try {
      const { hostname, href } = new URL(value);
      if (hostname !== 'localhost' && !hostname.includes('.')) throw 0;
      return { value: href };
    } catch {
      return { value: '', error: 'Địa chỉ website chưa hợp lệ.' };
    }
  };

  const buildQr = text => {
    const ecc = state.logo ? 'H' : 'M';
    const first = state.logo ? 6 : 0;
    const last = state.logo ? 40 : 0;
    let failure;
    for (let version = first; version <= last; version++) {
      try {
        const qr = qrcode(version, ecc);
        qr.addData(text, 'Byte');
        qr.make();
        return qr;
      } catch (err) {
        failure = err;
      }
    }
    throw failure;
  };

  const radius = box => state.shape === 'circle' ? box / 2 : state.shape === 'rounded' ? box * 0.22 : 0;

  const logoGeo = count => {
    let side = Math.max(5, Math.round(count * $('logo-size').value / 100));
    if ((count - side) % 2) side++;
    const origin = MARGIN + (count - side) / 2;
    return { origin, side, inner: origin + 1, box: side - 2 };
  };

  const roundedPath = (x, y, size, r) => {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + size, y, x + size, y + size, r);
    ctx.arcTo(x + size, y + size, x, y + size, r);
    ctx.arcTo(x, y + size, x, y, r);
    ctx.arcTo(x, y, x + size, y, r);
    ctx.closePath();
  };

  const drawLogo = (count, bg) => {
    const { origin, side, inner, box } = logoGeo(count);
    const { img } = state.logo;
    const ratio = [box / img.naturalWidth, box / img.naturalHeight];
    const scale = state.shape === 'square' ? Math.min(...ratio) : Math.max(...ratio);
    const w = img.naturalWidth * scale;
    const h = img.naturalHeight * scale;
    ctx.fillStyle = bg;
    ctx.fillRect(origin, origin, side, side);
    ctx.save();
    roundedPath(inner, inner, box, radius(box));
    ctx.clip();
    ctx.drawImage(img, inner + (box - w) / 2, inner + (box - h) / 2, w, h);
    ctx.restore();
  };

  const render = () => {
    const { value, error } = readContent();
    if (error || !value) return reset(error);
    try {
      const qr = buildQr(value);
      const count = qr.getModuleCount();
      const total = count + MARGIN * 2;
      const cell = Math.max(1, Math.floor(Number($('opt-size').value) / total));
      const fg = $('opt-fg').value;
      const bg = $('opt-bg').value;
      canvas.width = canvas.height = cell * total;
      ctx.setTransform(cell, 0, 0, cell, 0, 0);
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, total, total);
      ctx.fillStyle = fg;
      for (let r = 0; r < count; r++) {
        for (let c = 0; c < count; c++) {
          if (qr.isDark(r, c)) ctx.fillRect(c + MARGIN, r + MARGIN, 1, 1);
        }
      }
      if (state.logo) drawLogo(count, bg);
      state.qr = qr;
      $('empty').hidden = true;
      canvas.hidden = false;
      buttons.forEach(b => { b.disabled = false; });
      showError('');
    } catch {
      reset('Nội dung quá dài.');
    }
  };

  const reset = message => {
    state.qr = null;
    canvas.hidden = true;
    $('empty').hidden = false;
    buttons.forEach(b => { b.disabled = true; });
    showError(message);
  };

  const schedule = () => {
    clearTimeout(timer);
    timer = setTimeout(render, 120);
  };

  const buildSvg = () => {
    const count = state.qr.getModuleCount();
    const total = count + MARGIN * 2;
    const fg = $('opt-fg').value;
    const bg = $('opt-bg').value;
    let path = '';
    for (let r = 0; r < count; r++) {
      for (let c = 0; c < count; c++) {
        if (state.qr.isDark(r, c)) path += `M${c + MARGIN} ${r + MARGIN}h1v1h-1z`;
      }
    }
    let logo = '';
    if (state.logo) {
      const { origin, side, inner, box } = logoGeo(count);
      const fit = state.shape === 'square' ? 'meet' : 'slice';
      logo = `<rect x="${origin}" y="${origin}" width="${side}" height="${side}" fill="${bg}"/>` +
        `<clipPath id="c"><rect x="${inner}" y="${inner}" width="${box}" height="${box}" rx="${radius(box)}"/></clipPath>` +
        `<image x="${inner}" y="${inner}" width="${box}" height="${box}" preserveAspectRatio="xMidYMid ${fit}" clip-path="url(#c)" href="${state.logo.url}"/>`;
    }
    return `<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${total} ${total}" width="1024" height="1024" shape-rendering="crispEdges">` +
      `<rect width="${total}" height="${total}" fill="${bg}"/><path d="${path}" fill="${fg}"/>${logo}</svg>`;
  };

  const pngBlob = () => new Promise(resolve => canvas.toBlob(resolve, 'image/png'));

  const fileName = ext => `qr-${new Date().toISOString().slice(0, 19).replace(/[T:]/g, '-')}.${ext}`;

  const save = (blob, name) => {
    const url = URL.createObjectURL(blob);
    const a = Object.assign(document.createElement('a'), { href: url, download: name });
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  };

  const flash = text => {
    const btn = $('btn-copy');
    btn.textContent = text;
    clearTimeout(copyTimer);
    copyTimer = setTimeout(() => { btn.textContent = 'Sao chép'; }, 1600);
  };

  const copyImage = async () => {
    if (!state.qr) return;
    try {
      await navigator.clipboard.write([new ClipboardItem({ 'image/png': pngBlob() })]);
      flash('Đã chép');
      return;
    } catch {}
    try {
      const blob = await pngBlob();
      const file = new File([blob], fileName('png'), { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file] });
        return;
      }
      save(blob, file.name);
      flash('Đã tải PNG');
    } catch (err) {
      if (err && err.name !== 'AbortError') flash('Không chép được');
    }
  };

  const pick = (box, onPick) => box.addEventListener('click', e => {
    const btn = e.target.closest('button');
    if (!btn) return;
    box.querySelectorAll('button').forEach(node => node.setAttribute('aria-pressed', node === btn));
    onPick(btn.dataset.v);
  });

  pick($('seg-mode'), value => {
    state.mode = value;
    $('in-text').hidden = value !== 'text';
    $('in-web').hidden = value !== 'web';
    render();
  });
  pick($('seg-shape'), value => { state.shape = value; render(); });

  const setLogo = (url, img) => {
    state.logo = { url, img };
    $('logo-thumb').src = url;
    $('logo-tools').hidden = false;
    $('btn-logo-clear').disabled = false;
    render();
  };

  const clearLogo = () => {
    state.logo = null;
    $('logo-file').value = '';
    $('logo-thumb').removeAttribute('src');
    $('logo-tools').hidden = true;
    $('btn-logo-clear').disabled = true;
    render();
  };

  const loadLogo = file => {
    if (!file) return;
    if (!file.type.startsWith('image/')) return showError('File này không phải ảnh.');
    const reader = new FileReader();
    reader.onerror = () => showError('Không đọc được ảnh.');
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => showError('Không đọc được ảnh.');
      img.onload = () => setLogo(reader.result, img);
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  };

  $('btn-logo').addEventListener('click', () => $('logo-file').click());
  $('btn-logo-clear').addEventListener('click', clearLogo);
  $('logo-file').addEventListener('change', e => loadLogo(e.target.files[0]));
  $('logo-size').addEventListener('input', e => {
    $('logo-pct').textContent = e.target.value + '%';
    schedule();
  });
  $('btn-png').addEventListener('click', async () => {
    const blob = state.qr && await pngBlob();
    if (blob) save(blob, fileName('png'));
  });
  $('btn-svg').addEventListener('click', () => {
    if (state.qr) save(new Blob([buildSvg()], { type: 'image/svg+xml;charset=utf-8' }), fileName('svg'));
  });
  $('btn-copy').addEventListener('click', copyImage);

  ['in-text', 'in-web', 'opt-fg', 'opt-bg'].forEach(id => $(id).addEventListener('input', schedule));
  $('opt-size').addEventListener('change', render);
})();
</script>
</body>
</html>
