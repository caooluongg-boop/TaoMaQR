<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tạo mã QR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e8eef2;
  --panel:#fff;
  --ink:#14232b;
  --muted:#5b6b75;
  --line:#c8d3da;
  --field:#f6f9fb;
  --accent:#0e6b66;
  --danger:#b3261e;
}
*{box-sizing:border-box}
body{
  margin:0;
  padding:20px 16px 40px;
  background:var(--bg);
  color:var(--ink);
  font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  line-height:1.5;
}
.app{max-width:520px;margin:0 auto}
h1{font-size:26px;font-weight:700;margin:4px 0 16px;letter-spacing:-.3px}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:#d5dee4;border-radius:12px;padding:4px;margin-bottom:16px}
.tab{
  border:0;background:transparent;color:var(--muted);
  font:inherit;font-weight:600;font-size:15px;
  padding:11px 8px;border-radius:9px;cursor:pointer;
}
.tab[aria-selected="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(20,35,43,.18)}
.panel{background:var(--panel);border-radius:16px;padding:18px;margin-bottom:16px}
label{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
textarea,input[type="url"],select{
  width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--field);
  border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;
}
textarea{min-height:110px;resize:vertical}
[hidden]{display:none!important}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.full{grid-column:1/-1}
input[type="color"]{
  width:100%;height:44px;padding:3px;cursor:pointer;
  background:var(--field);border:1.5px solid var(--line);border-radius:10px;
}
.btn{
  border:0;font:inherit;font-weight:600;font-size:16px;
  padding:13px 18px;border-radius:12px;cursor:pointer;width:100%;
}
.btn.primary{background:var(--accent);color:#fff}
.btn.ghost{background:#e3ebef;color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:active:not(:disabled){transform:translateY(1px)}
:is(.tab,.btn,input,select,textarea):focus-visible{outline:3px solid #6bb7b1;outline-offset:2px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.logo-info{display:flex;align-items:center;gap:10px;margin-top:10px}
.logo-info img{width:44px;height:44px;flex:none;object-fit:contain;background:var(--field);border:1.5px solid var(--line);border-radius:8px}
.logo-info input{flex:1;accent-color:var(--accent)}
.logo-info span{min-width:40px;text-align:right;font-size:13px;color:var(--muted)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.result{text-align:center}
.stage{
  display:flex;align-items:center;justify-content:center;min-height:260px;padding:14px;
  background:var(--field);border:1.5px dashed var(--line);border-radius:14px;color:var(--muted);font-size:14px;
}
.stage canvas{max-width:100%;height:auto;display:block;border-radius:6px}
.error{min-height:20px;margin:10px 0 0;color:var(--danger);font-weight:500;font-size:14px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
</style>
</head>
<body>
<main class="app">
  <h1>Tạo mã QR</h1>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-text" aria-selected="true">Văn bản</button>
    <button class="tab" role="tab" id="tab-web" aria-selected="false">Website</button>
  </div>

  <section class="panel">
    <div id="view-text">
      <label for="input-text">Nội dung</label>
      <textarea id="input-text" placeholder="Nhập hoặc dán văn bản"></textarea>
    </div>
    <div id="view-web" hidden>
      <label for="input-web">Địa chỉ website</label>
      <input type="url" id="input-web" inputmode="url" autocapitalize="off" autocomplete="off" spellcheck="false" placeholder="vi-du.com">
    </div>

    <div class="opts">
      <div>
        <label for="opt-size">Kích thước</label>
        <select id="opt-size">
          <option value="256">256 px</option>
          <option value="512" selected>512 px</option>
          <option value="1024">1024 px</option>
          <option value="2048">2048 px</option>
        </select>
      </div>
      <div>
        <label for="opt-ecc">Chịu lỗi</label>
        <select id="opt-ecc">
          <option value="L">Thấp</option>
          <option value="M" selected>Vừa</option>
          <option value="Q">Khá</option>
          <option value="H">Cao</option>
        </select>
      </div>
      <div>
        <label for="opt-fg">Màu mã</label>
        <input type="color" id="opt-fg" value="#14232b">
      </div>
      <div>
        <label for="opt-bg">Màu nền</label>
        <input type="color" id="opt-bg" value="#ffffff">
      </div>
      <div class="full">
        <label for="logo-file">Ảnh giữa</label>
        <input type="file" id="logo-file" class="sr-only" accept="image/*">
        <div class="row">
          <button class="btn ghost" id="btn-logo" type="button">Chọn ảnh</button>
          <button class="btn ghost" id="btn-logo-clear" type="button" disabled>Xoá ảnh</button>
        </div>
        <div class="logo-info" id="logo-info" hidden>
          <img id="logo-thumb" alt="">
          <input type="range" id="logo-size" min="10" max="25" value="16" aria-label="Kích thước ảnh giữa">
          <span id="logo-pct">16%</span>
        </div>
      </div>
    </div>
  </section>

  <section class="panel result">
    <div class="stage" id="stage">
      <span id="empty">QR hiện ở đây</span>
      <canvas id="canvas" hidden></canvas>
    </div>
    <p class="error" id="error" role="alert"></p>
    <div class="actions">
      <button class="btn primary" id="btn-png" type="button" disabled>Tải PNG</button>
      <button class="btn ghost" id="btn-svg" type="button" disabled>Tải SVG</button>
    </div>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const el = {
    tabText: $('tab-text'), tabWeb: $('tab-web'),
    viewText: $('view-text'), viewWeb: $('view-web'),
    inputText: $('input-text'), inputWeb: $('input-web'),
    size: $('opt-size'), ecc: $('opt-ecc'), fg: $('opt-fg'), bg: $('opt-bg'),
    logoFile: $('logo-file'), btnLogo: $('btn-logo'), btnLogoClear: $('btn-logo-clear'),
    logoInfo: $('logo-info'), logoThumb: $('logo-thumb'), logoSize: $('logo-size'), logoPct: $('logo-pct'),
    canvas: $('canvas'), empty: $('empty'), error: $('error'),
    btnPng: $('btn-png'), btnSvg: $('btn-svg')
  };

  const MARGIN = 4;
  const LOGO_MIN_VERSION = 6;
  const MSG = {
    badUrl: 'Địa chỉ website chưa hợp lệ.',
    tooLong: 'Nội dung quá dài.',
    notImage: 'File này không phải ảnh.',
    readFail: 'Không đọc được ảnh.',
    noLib: 'Không tải được thư viện QR. Kiểm tra mạng rồi mở lại.'
  };

  let mode = 'text';
  let current = null;
  let logo = null;
  let savedEcc = null;

  if (!window.qrcode) {
    el.error.textContent = MSG.noLib;
    return;
  }
  qrcode.stringToBytes = qrcode.stringToBytesFuncs['UTF-8'];

  const normalizeUrl = raw => {
    let value = raw.trim();
    if (!value) return { value: '' };
    if (!/^[a-z][a-z0-9+.-]*:\/\//i.test(value)) value = 'https://' + value;
    try {
      const { hostname, href } = new URL(value);
      if (hostname !== 'localhost' && !hostname.includes('.')) return { value: '', error: MSG.badUrl };
      return { value: href };
    } catch {
      return { value: '', error: MSG.badUrl };
    }
  };

  const getContent = () =>
    mode === 'text' ? { value: el.inputText.value } : normalizeUrl(el.inputWeb.value);

  const buildQr = (text, ecc) => {
    const first = logo ? LOGO_MIN_VERSION : 0;
    const last = logo ? 40 : 0;
    let failure;
    for (let version = first; version <= last; version++) {
      try {
        const qr = qrcode(version, ecc);
        qr.addData(text, 'Byte');
        qr.make();
        return qr;
      } catch (err) {
        failure = err;
      }
    }
    throw failure;
  };

  const fit = (img, box) => {
    const scale = Math.min(box / img.naturalWidth, box / img.naturalHeight);
    return { w: img.naturalWidth * scale, h: img.naturalHeight * scale };
  };

  const logoRect = count => {
    let side = Math.max(5, Math.round(count * el.logoSize.value / 100));
    if ((count - side) % 2) side++;
    return { side, start: (count - side) / 2 };
  };

  const drawLogo = (ctx, count, cell, bg) => {
    const { side, start } = logoRect(count);
    const origin = (MARGIN + start) * cell;
    const span = side * cell;
    const { w, h } = fit(logo.img, span - 2 * cell);
    ctx.fillStyle = bg;
    ctx.fillRect(origin, origin, span, span);
    ctx.drawImage(logo.img, origin + (span - w) / 2, origin + (span - h) / 2, w, h);
  };

  const drawQr = (qr, size, fg, bg) => {
    const count = qr.getModuleCount();
    const total = count + MARGIN * 2;
    const cell = Math.max(1, Math.floor(size / total));
    const px = cell * total;
    const ctx = el.canvas.getContext('2d');
    el.canvas.width = px;
    el.canvas.height = px;
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, px, px);
    ctx.fillStyle = fg;
    for (let r = 0; r < count; r++) {
      for (let c = 0; c < count; c++) {
        if (qr.isDark(r, c)) ctx.fillRect((c + MARGIN) * cell, (r + MARGIN) * cell, cell, cell);
      }
    }
    if (logo) drawLogo(ctx, count, cell, bg);
  };

  const buildSvg = (qr, fg, bg) => {
    const count = qr.getModuleCount();
    const total = count + MARGIN * 2;
    let path = '';
    for (let r = 0; r < count; r++) {
      for (let c = 0; c < count; c++) {
        if (qr.isDark(r, c)) path += `M${c + MARGIN} ${r + MARGIN}h1v1h-1z`;
      }
    }
    let logoSvg = '';
    if (logo) {
      const { side, start } = logoRect(count);
      const origin = MARGIN + start;
      const { w, h } = fit(logo.img, side - 2);
      logoSvg =
        `<rect x="${origin}" y="${origin}" width="${side}" height="${side}" fill="${bg}"/>` +
        `<image x="${origin + (side - w) / 2}" y="${origin + (side - h) / 2}" width="${w}" height="${h}" href="${logo.url}"/>`;
    }
    return `<?xml version="1.0" encoding="UTF-8"?>` +
      `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${total} ${total}" width="1024" height="1024" shape-rendering="crispEdges">` +
      `<rect width="${total}" height="${total}" fill="${bg}"/>` +
      `<path d="${path}" fill="${fg}"/>${logoSvg}</svg>`;
  };

  const reset = message => {
    current = null;
    el.canvas.hidden = true;
    el.empty.hidden = false;
    el.btnPng.disabled = true;
    el.btnSvg.disabled = true;
    el.error.textContent = message || '';
  };

  const generate = () => {
    const { value, error } = getContent();
    if (error || !value) return reset(error);
    try {
      const qr = buildQr(value, logo ? 'H' : el.ecc.value);
      drawQr(qr, Number(el.size.value), el.fg.value, el.bg.value);
      current = qr;
      el.empty.hidden = true;
      el.canvas.hidden = false;
      el.btnPng.disabled = false;
      el.btnSvg.disabled = false;
      el.error.textContent = '';
    } catch {
      reset(MSG.tooLong);
    }
  };

  const fileName = ext => {
    const stamp = new Date().toISOString().slice(0, 19).replace(/[T:]/g, '-');
    return `qr-${stamp}.${ext}`;
  };

  const save = (blob, name) => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  };

  const setMode = next => {
    mode = next;
    const isText = next === 'text';
    el.tabText.setAttribute('aria-selected', isText);
    el.tabWeb.setAttribute('aria-selected', !isText);
    el.viewText.hidden = !isText;
    el.viewWeb.hidden = isText;
    generate();
  };

  const setLogo = (url, img) => {
    logo = { url, img };
    el.logoThumb.src = url;
    el.logoInfo.hidden = false;
    el.btnLogoClear.disabled = false;
    if (savedEcc === null) savedEcc = el.ecc.value;
    el.ecc.value = 'H';
    el.ecc.disabled = true;
    generate();
  };

  const clearLogo = () => {
    logo = null;
    el.logoFile.value = '';
    el.logoThumb.removeAttribute('src');
    el.logoInfo.hidden = true;
    el.btnLogoClear.disabled = true;
    if (savedEcc !== null) el.ecc.value = savedEcc;
    savedEcc = null;
    el.ecc.disabled = false;
    generate();
  };

  const loadLogo = file => {
    if (!file) return;
    if (!file.type.startsWith('image/')) {
      el.error.textContent = MSG.notImage;
      el.logoFile.value = '';
      return;
    }
    const reader = new FileReader();
    reader.onerror = () => { el.error.textContent = MSG.readFail; };
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => { el.error.textContent = MSG.readFail; };
      img.onload = () => setLogo(reader.result, img);
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  };

  el.tabText.addEventListener('click', () => setMode('text'));
  el.tabWeb.addEventListener('click', () => setMode('web'));
  el.btnLogo.addEventListener('click', () => el.logoFile.click());
  el.btnLogoClear.addEventListener('click', clearLogo);
  el.logoFile.addEventListener('change', () => loadLogo(el.logoFile.files[0]));
  el.logoSize.addEventListener('input', () => {
    el.logoPct.textContent = el.logoSize.value + '%';
    generate();
  });
  el.btnPng.addEventListener('click', () => {
    if (current) el.canvas.toBlob(blob => blob && save(blob, fileName('png')), 'image/png');
  });
  el.btnSvg.addEventListener('click', () => {
    if (current) save(new Blob([buildSvg(current, el.fg.value, el.bg.value)], { type: 'image/svg+xml;charset=utf-8' }), fileName('svg'));
  });

  [el.inputText, el.inputWeb, el.fg, el.bg].forEach(node => node.addEventListener('input', generate));
  [el.size, el.ecc].forEach(node => node.addEventListener('change', generate));
})();
</script>
</body>
</html>
